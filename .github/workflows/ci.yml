name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-java-11:
    name: Core / Java 11
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Verify core
        run: mvn -B -ntp -pl decimal-regions-core -am clean verify

  build-and-consumer:
    name: Build and consumer / Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and install all library modules
        run: mvn -B -ntp clean install

      - name: Verify starter consumer
        shell: bash
        run: |
          DECIMAL_REGIONS_VERSION="$(mvn -N -B -ntp -q -Dstyle.color=never help:evaluate -Dexpression=project.version -DforceStdout)"
          mvn -B -ntp -f integration-tests/starter-consumer/pom.xml -Ddecimal-regions.version="$DECIMAL_REGIONS_VERSION" clean verify